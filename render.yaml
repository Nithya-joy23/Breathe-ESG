services:
  - type: web
    name: breathe-esg-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python breathe-esg/backend/manage.py collectstatic --noinput
    startCommand: python breathe-esg/backend/reset_db.py && python breathe-esg/backend/manage.py migrate && gunicorn --chdir breathe-esg/backend config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://breathe-esg-frontend-gcjg.onrender.com
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db2
          property: connectionString

  - type: web
    name: breathe-esg-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://breathe-esg-api.onrender.com/api

databases:
  - name: breathe-esg-db2
    plan: free

